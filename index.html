<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RPM Meter</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<h1>RPM Meter</h1>

<button id="start">Mikrofon starten</button>

<div class="card">
    <div>Pegel</div>
    <progress id="level" value="0" max="1"></progress>
</div>

<div class="card">
    <div>Frequenz</div>
    <span id="freq">-- Hz</span>
</div>

<div class="card">
    <div>Drehzahl</div>
    <span id="rpm">-- rpm</span>
</div>

<canvas id="scope"></canvas>

<script src="app.js?v=6"></script>

</body>
</html>
